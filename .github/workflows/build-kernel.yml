name: Build S9+ NetHunter Kernel (UB500 Supported)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-20

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-20

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            liblz4-tool \
            bc \
            git \
            zip \
            unzip \
            cpio \
            python2 \
            python3 \
            libssl-dev

      - name: Set up AArch64 Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Apply TP-Link UB500 Driver Patch
        run: |
          # Patch drivers/bluetooth/btusb.c safely
          if grep -q "0x2357, 0x0604" drivers/bluetooth/btusb.c; then
            echo "UB500 already present in btusb.c"
          else
            sed -i '/USB_DEVICE(0x0bda, 0xc822)/a \t/* TP-Link UB500 / Realtek RTL8761BU */\n\t{ USB_DEVICE(0x2357, 0x0604), .driver_info = BTUSB_REALTEK },' drivers/bluetooth/btusb.c
          fi

          # Append USB and Bluetooth kernel config flags to star2lte defconfig
          echo "CONFIG_BT_HCIBTUSB=m" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_BT_HCIBTUSB_RTL=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_BT_RTL=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_USB_SUPPORT=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_USB=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export PYTHON=python2

          make O=out exynos9810-star2lte_defconfig
          
          # Run parallel make first; if it fails, run -j1 to print the exact broken line/file
          make -j$(nproc --all) O=out KCFLAGS="-w" || make -j1 O=out KCFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi

          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=star2lte/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=star2ltexx/g' anykernel.sh
          
          zip -r9 ../S9p-NetHunter-UB500-Kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: S9p-NetHunter-UB500-Kernel
          path: S9p-NetHunter-UB500-Kernel.zip
          
