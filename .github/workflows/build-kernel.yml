name: Build S9+ NetHunter Kernel (UB500 Supported)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - lineage-20 # Runs on pushes to lineage-20 branch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          ref: lineage-20

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            liblz4-tool \
            bc \
            git \
            zip \
            unzip \
            cpio \
            python2 \
            python3

      - name: Set up AArch64 Toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Apply TP-Link UB500 Driver Patch
        run: |
          # Patch drivers/bluetooth/btusb.c to add UB500 (RTL8761BU ID 2357:0604)
          sed -i '/USB_DEVICE(0x0bda, 0xc822)/a \thttps://github.com/mylesgoose/android_kernel_samsung_exynos9810.git/* TP-Link UB500 / Realtek RTL8761BU */\n\t{ USB_DEVICE(0x2357, 0x0604), .driver_info = BTUSB_REALTEK },' drivers/bluetooth/btusb.c || true

          # Append USB and Bluetooth kernel config flags to star2lte defconfig
          echo "CONFIG_BT_HCIBTUSB=m" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_BT_HCIBTUSB_RTL=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_BT_RTL=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_USB_SUPPORT=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig
          echo "CONFIG_USB=y" >> arch/arm64/configs/exynos9810-star2lte_defconfig

      - name: Compile Kernel Image
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/toolchains/gcc64/bin:$HOME/toolchains/gcc32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out exynos9810-star2lte_defconfig
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # Copy compiled kernel image to AnyKernel3 directory
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          # Adjust AnyKernel3 flash flags for Samsung S9+ (star2lte)
          cd AnyKernel3
          sed -i 's/device.name1=.*/device.name1=star2lte/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=star2ltexx/g' anykernel.sh
          
          zip -r9 ../S9p-NetHunter-UB500-Kernel.zip * -x .git README.md *placeholder

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v3
        with:
          name: S9p-NetHunter-UB500-Kernel
          path: S9p-NetHunter-UB500-Kernel.zip
